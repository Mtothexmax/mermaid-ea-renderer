<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Mermaid Renderer</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = { darkMode: "class" };
</script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

<style>
    :root {
        color-scheme: light;
    }

    #app.dark {
        color-scheme: dark;
    }

    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #e7ebf0;
    }

    .material-icons-round {
      font-size: 20px;
      line-height: 1;
    }

    .ea-grid {
      background-color: #f7f8fa;
      background-image:
        linear-gradient(#dfe3e8 1px, transparent 1px),
        linear-gradient(90deg, #dfe3e8 1px, transparent 1px),
        linear-gradient(#eceff2 1px, transparent 1px),
        linear-gradient(90deg, #eceff2 1px, transparent 1px);
      background-size:
        100px 100px,
        100px 100px,
        20px 20px,
        20px 20px;
    }

    .diagram svg {
      max-width: none !important;
      height: auto;
    }

    .diagram .node rect,
    .diagram .node polygon,
    .diagram .node path,
    .diagram .node circle,
    .diagram .node ellipse {
      stroke: #4d5966 !important;
      stroke-width: 1.1px !important;
      filter: drop-shadow(0 1px 1px rgba(15, 23, 42, 0.12));
    }

    .diagram .nodeLabel,
    .diagram .edgeLabel {
      font-family: "Segoe UI", Arial, sans-serif !important;
      color: #1f2937 !important;
    }

    .diagram .edgeLabel {
      background: #f7f8fa !important;
    }

    .diagram .cluster rect {
      fill: rgba(228, 235, 244, 0.62) !important;
      stroke: #778899 !important;
      stroke-dasharray: 4 3;
    }

    .diagram .cluster-label {
      font-weight: 600;
      color: #334155 !important;
    }

    .dark .ea-grid {
      background-color: #12161c;
      background-image:
        linear-gradient(#1f2530 1px, transparent 1px),
        linear-gradient(90deg, #1f2530 1px, transparent 1px),
        linear-gradient(#181c24 1px, transparent 1px),
        linear-gradient(90deg, #181c24 1px, transparent 1px);
    }

    .dark .diagram .node rect,
    .dark .diagram .node polygon,
    .dark .diagram .node path,
    .dark .diagram .node circle,
    .dark .diagram .node ellipse {
      stroke: #8a93a3 !important;
    }

    .dark .diagram .nodeLabel,
    .dark .diagram .edgeLabel {
      color: #e2e8f0 !important;
    }

    .dark .diagram .edgeLabel {
      background: #12161c !important;
    }

    .dark .diagram .cluster rect {
      fill: rgba(35, 41, 54, 0.62) !important;
      stroke: #5b6472 !important;
    }

    .dark .diagram .cluster-label {
      color: #cbd5e1 !important;
    }

    .diagram g.node {
      cursor: pointer;
    }

    .diagram g.node:hover rect,
    .diagram g.node:hover polygon,
    .diagram g.node:hover circle,
    .diagram g.node:hover ellipse,
    .diagram g.node:hover path {
      stroke: #0b6bcb !important;
      stroke-width: 2px !important;
    }

    .diagram g.node.selected rect,
    .diagram g.node.selected polygon,
    .diagram g.node.selected circle,
    .diagram g.node.selected ellipse,
    .diagram g.node.selected path {
      stroke: #005fb8 !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 0 4px rgba(0, 95, 184, 0.3));
    }

    .diagram g.node.missing-note rect,
    .diagram g.node.missing-note polygon,
    .diagram g.node.missing-note circle,
    .diagram g.node.missing-note ellipse,
    .diagram g.node.missing-note path {
      stroke: #dc2626 !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 0 4px rgba(220, 38, 38, 0.35));
    }

    .dark .diagram g.node.missing-note rect,
    .dark .diagram g.node.missing-note polygon,
    .dark .diagram g.node.missing-note circle,
    .dark .diagram g.node.missing-note ellipse,
    .dark .diagram g.node.missing-note path {
      stroke: #f87171 !important;
    }

    textarea {
      scrollbar-width: thin;
    }

    .resize-handle {
      cursor: col-resize;
      width: 5px;
      transition: background 0.15s;
    }

    .resize-handle:hover {
      background: #0b6bcb;
    }

    .toast-enter-active,
    .toast-leave-active {
      transition: all 0.2s ease;
    }

    .toast-enter-from,
    .toast-leave-to {
      opacity: 0;
      transform: translateY(8px);
    }
</style>
</head>

<body>
<div id="app" class="h-full">

    <header class="h-11 shrink-0 bg-[#263746] text-white flex items-center px-3 gap-3 shadow-md z-30">

        <button v-if="missingNoteIds.length" type="button"

        </div>

    <div class="flex-1 flex justify-center min-w-0">
        <div class="inline-flex rounded-sm bg-white/10 p-0.5 text-xs">
            <button type="button" class="px-3 py-1 rounded-sm flex items-center gap-1.5" :class="

                Diagramm

            <button type="button" class="px-3 py-1 rounded-sm flex items-center gap-1.5" :class="

    </div>

    <div class="flex items-center gap-0.5 shrink-0">
        <button type="button" :title="darkMode ? 'Helles Design' : 'Dunkles Design'" class="p-1.5 rounded hover:bg-white/10" @click="toggleDarkMode">
            <span class="material-icons-round !text-[18px]">{{ darkMode ? 'light_mode' : 'dark_mode' }}</span>
        </button>

        <div class="h-5 w-px bg-white/20 mx-1.5"></div>
<button type="button"

    <span class="hidden sm:inline">Mermaid einfügen</span>
</button>
<button type="button"

    <span class="hidden sm:inline">Mermaid kopieren</span>
</button>

<div class="h-5 w-px bg-white/20 mx-1.5"></div>

<button type="button"
    title="Als HTML herunterladen"
    class="h-8 px-2.5 rounded bg-white/10 hover:bg-white/20 flex items-center gap-1.5 text-xs font-medium shadow"
    @click="downloadHtml">
    <span class="material-icons-round !text-[16px]">download</span>
    <span class="hidden sm:inline">Als HTML herunterladen</span>
</button>
</div>
</header>

    <main class="flex-1 min-h-0 flex overflow-hidden">
        <section class="flex-1 min-w-0 relative bg-white dark:bg-[#12161c] flex flex-col overflow-hidden">
        <div v-if="activeView === 'diagram'" class="h-10 shrink-0 border-b border-slate-300 dark:border-slate-700 bg-[#e8ebee] dark:bg-[#1a1f27] flex items-center justify-center gap-0.5 px-3">
            <button type="button" title="Diagramm einpassen" class="inline-flex items-center justify-center p-1.5 rounded hover:bg-black/5 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300" @click="fitDiagram">
                <span class="material-icons-round !text-[18px]">fit_screen</span>
            </button>

            <button type="button" title="Verkleinern" class="inline-flex items-center justify-center p-1.5 rounded hover:bg-black/5 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300" @click="zoomOut">
                <span class="material-icons-round !text-[18px]">zoom_out</span>

            <button type="button" title="Standard-Zoom" class="inline-flex items-center justify-center w-12 p-1.5 leading-[18px] rounded hover:bg-black/5 dark:hover:bg-white/10 text-xs tabular-nums text-slate-700 dark:text-slate-200" @click="resetZoom">

            </button>

            <button type="button" title="Schrift verkleinern" class="inline-flex items-center justify-center p-1.5 rounded hover:bg-black/5 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300" @click="fontSizeOut">

<div v-else class="flex-1 min-h-0 flex flex-col bg-[#1e2935]">

<script>
    const SAMPLE = `flowchart TD
Start(["▶ Prozess gestartet"])
Action["Markdown verarbeiten"]
Decision{"Notizen vorhanden?"}
End(["⏹ Prozess abgeschlossen"])
Start --> Action
Action --> Decision
Decision -- Ja --> End
Decision -- Nein --> End

NoteStart@{ shape: braces, label: "Der Prozess wird gestartet." }
NoteStart --- Start
NoteAction@{ shape: braces, label: "Der Markdown-Quelltext wird analysiert und als Diagramm dargestellt." }
NoteAction --- Action
NoteDecision@{ shape: braces, label: "Es wird geprüft, ob dem Diagramm Notizen zugeordnet sind." }
NoteDecision --- Decision
NoteEnd@{ shape: braces, label: "Der Prozess wurde erfolgreich abgeschlossen." }
NoteEnd --- End`;

        const {
            createApp,
            ref,
            computed,
            nextTick,
            onMounted,
            watch
        } = Vue;

        createApp({
            setup() {
            const NL = String.fromCharCode(10);
            const BS = String.fromCharCode(92);

            const source = ref(
                localStorage.getItem("mermaidRendererSource") || SAMPLE
            );
            const diagramEl = ref(null);
            const viewport = ref(null);
            const zoom = ref(0.9);
            const baseWidth = ref(0);
            const activeView = ref("diagram");
            const panelWidth = ref(470);
            const search = ref("");
            const notes = ref([]);
            const selectedId = ref("");
            const showNoteList = ref(
                localStorage.getItem("mermaidRendererShowNoteList") !== "0"
            );
            const dirty = ref(false);
            const error = ref("");
            const toast = ref("");
            const highlightMissingNotes = ref(false);
            const darkMode = ref(
                localStorage.getItem("mermaidRendererDarkMode") === "1"
            );
            const fontSize = ref(
                Number(localStorage.getItem("mermaidRendererFontSize")) || 13
            );

            const splitLines = value => value.split(NL);

            function decode(value) {
                const area = document.createElement("textarea");
                area.innerHTML = value.replaceAll("#quot;", "&quot;");
                return area.value;
            }

        function extractNodeLabels(text) {
            const result = {};

            const pattern =
                /^([A-Za-z_][\w-]*)\s*(?:\[\("([\s\S]*?)"\)\]|\(\["([\s\S]*?)"\]\)|\["([\s\S]*?)"\]|\{"([\s\S]*?)"\}|\(\("([\s\S]*?)"\)\))/;

            splitLines(text).forEach(line => {
                const match = line.trim().match(pattern);

                if (!match) {
                    return;
                }

              const label = match.slice(2).find(Boolean) || match[1];

              result[match[1]] = decode(
                  label.split(BS + "n").join(" ")
              );
          });

            return result;
        }

        function parseNotes(text) {
            const labels = extractNodeLabels(text);
            const definitions = new Map();
            const links = new Map();

            const notePattern =
                /^([A-Za-z_][\w-]*)@\{\s*shape:\s*braces\s*,\s*label:\s*"((?:[^"\\]|\\.)*)"\s*\}\s*;?\s*$/gm;

            const linkPattern =
                /^([A-Za-z_][\w-]*)\s*---\s*([A-Za-z_][\w-]*)\s*;?\s*$/gm;

            let match;

            while ((match = notePattern.exec(text))) {
                let value = match[2];

                value = value
                    .split(BS + '"')
                    .join('"')
                    .split(BS + "n")
                    .join(NL)
                    .split(BS + BS)
                    .join(BS);

                definitions.set(match[1], decode(value));
            }

            while ((match = linkPattern.exec(text))) {
                if (definitions.has(match[1])) {
                    links.set(match[1], match[2]);
                } else if (definitions.has(match[2])) {
                    links.set(match[2], match[1]);
                }
            }

            return Array.from(definitions, entry => {
                const noteId = entry[0];
                const nodeId =
                    links.get(noteId) ||
                    noteId.replace(/^Note/, "");

                return {
                    noteId,
                    nodeId,
                    label: labels[nodeId] || nodeId,
                    text: entry[1]
                };
            });
        }

        function stripNotes(text) {
            const noteIds = new Set();

                const notePattern =
                    /^([A-Za-z_][\w-]*)@\{\s*shape:\s*braces\s*,\s*label:\s*"(?:[^"\\]|\\.)*"\s*\}\s*;?\s*$/gm;

                const withoutNotes = text.replace(
                    notePattern,
                    function replaceNote(all, id) {
                        noteIds.add(id);
                        return "";
                    }
                );

                return splitLines(withoutNotes)
                    .filter(line => {
                        const match = line
                            .trim()
                            .match(
                                /^([A-Za-z_][\w-]*)\s*---\s*([A-Za-z_][\w-]*)\s*;?$/
                            );

                        return !(
                            match &&
                            (
                                noteIds.has(match[1]) ||
                                noteIds.has(match[2])
                            )
                        );
                    })
                    .join(NL)
                    .replaceAll("#quot;", "&quot;");
            }

            function classifyNodes(text) {
                const dataObjects = [];
                const decisions = [];
                const terminals = [];
                const merges = [];

                splitLines(text).forEach(line => {
                    const trimmed = line.trim();

                    const idMatch = trimmed.match(
                        /^([A-Za-z_][\w-]*)/
                    );

                    if (!idMatch) {
                        return;
                    }

                    const id = idMatch[1];

                    if (/^[A-Za-z_][\w-]*\[\("/.test(trimmed)) {
                        dataObjects.push(id);
                    } else if (/^[A-Za-z_][\w-]*\{"/.test(trimmed)) {
                        decisions.push(id);
                    } else if (/^[A-Za-z_][\w-]*\(\["/.test(trimmed)) {
                        terminals.push(id);
                    } else if (/^[A-Za-z_][\w-]*\(\("/.test(trimmed)) {
                        merges.push(id);
                    }
                });

                return [
                    dataObjects.length
                        ? `class ${dataObjects.join(",")} data;`
                        : "",
                    decisions.length
                        ? `class ${decisions.join(",")} decision;`
                        : "",
                    terminals.length
                        ? `class ${terminals.join(",")} terminal;`
                        : "",
                    merges.length
                        ? `class ${merges.join(",")} merge;`
                        : ""
                ]
                    .filter(Boolean)
                    .join(NL);
            }

            function buildDiagramSource(text) {
                const diagram = stripNotes(text);

                const styles = (
                    darkMode.value
                        ? [
                            "classDef default fill:#2a2f3a,stroke:#8a93a3,color:#e2e8f0;",
                            "classDef data fill:#20384a,stroke:#6ea8cf,color:#e2e8f0;",
                            "classDef decision fill:#4a3f14,stroke:#d8b94d,color:#f5eccb;",
                            "classDef terminal fill:#232936,stroke:#8a93a3,color:#e2e8f0;",
                            "classDef merge fill:#0f172a,stroke:#475569,color:#0f172a;"
                        ]
                        : [
                            "classDef default fill:#fffdf3,stroke:#4d5966,color:#1f2937;",
                            "classDef data fill:#dcebf7,stroke:#47718d,color:#1f2937;",
                            "classDef decision fill:#fff3c4,stroke:#8a7132,color:#1f2937;",
                            "classDef terminal fill:#e5edf4,stroke:#526779,color:#17212b;",
                            "classDef merge fill:#334155,stroke:#1e293b,color:#334155;"
                        ]
                ).join(NL);

                const classifications = classifyNodes(diagram);

                return [
                    diagram,
                    styles,
                    classifications
                ]
                    .filter(Boolean)
                    .join(NL);
        }

            const allNodeIds = computed(() => {
                const ids = new Set();

                splitLines(stripNotes(source.value)).forEach(line => {
                    const match = line
                        .trim()
                        .match(
                            /^([A-Za-z_][\w-]*)\s*(?:\[|\(|\{)/
                        );

                    if (
                        match &&
                        !["subgraph", "flowchart", "end"].includes(match[1])
                    ) {
                        ids.add(match[1]);
                    }
          });

            return ids;
        });

            const nodeCount = computed(() => allNodeIds.value.size);

            const missingNoteIds = computed(() => {
                return [...allNodeIds.value].filter(id => {
                    const note = notes.value.find(
                        item => item.nodeId === id
                    );

                    return !note || !note.text.trim();
                });
            });

            const noteEntries = computed(() => notes.value);

            const selectedNote = computed(() => {
                return notes.value.find(
                    item => item.nodeId === selectedId.value
                );
            });

            const filteredNotes = computed(() => {
                const query = search.value
                    .trim()
                    .toLocaleLowerCase("de");

                if (!query) {
                    return notes.value;
                }

            return notes.value.filter(item => {
                return [
                    item.nodeId,
                    item.label,
                    item.text
                ]
                    .join(" ")
                    .toLocaleLowerCase("de")
                    .includes(query);
            });
        });

        async function renderDiagram() {
            if (dirty.value) {
                applyNotes();
            }

            error.value = "";
            notes.value = parseNotes(source.value);
            dirty.value = false;
            activeView.value = "diagram";

            await nextTick();

            try {
              const renderId =
                  "eaDiagram" +
                  Date.now() +
                  Math.random()
                      .toString(36)
                      .slice(2);

              const result = await mermaid.render(
                  renderId,
                  buildDiagramSource(source.value)
              );

              diagramEl.value.innerHTML = result.svg;

                    const svg = diagramEl.value.querySelector("svg");

                    if (svg) {
                        baseWidth.value = svg.getBoundingClientRect().width;
                        applyZoomToSvg();
                    }

                    const labels = extractNodeLabels(source.value);

                    diagramEl.value
                        .querySelectorAll("g.node")
                        .forEach(node => {
                            node.addEventListener("click", () => {
                                const id = (node.id || "")
                                    .split("flowchart-")
                                    .pop()
                                    .replace(/-\d+$/, "");

                                if (!id) {
                                    return;
                                }

                                ensureNote(id, labels[id] || id);
                                selectNote(id);
                            });
                        });

                    applyMissingNoteHighlight();
                } catch (exception) {
                    error.value =
                        exception && exception.message
                            ? exception.message
                            : String(exception);
                }
            }

            function ensureNote(id, label) {
                if (notes.value.some(item => item.nodeId === id)) {
                    return;
                }

                notes.value.push({
                    noteId: "Note" + id,
                    nodeId: id,
                    label,
                    text: ""
                });
            }

            function selectNote(id) {
                selectedId.value = id;

                nextTick(() => {
                    if (!diagramEl.value) {
                        return;
                    }

                    diagramEl.value
                        .querySelectorAll("g.node")
                        .forEach(node => {
                            node.classList.toggle(
                                "selected",
                                node.id.includes(id)
                            );
                        });
                });
            }

            function toggleMissingNotesHighlight() {
                highlightMissingNotes.value = !highlightMissingNotes.value;
                applyMissingNoteHighlight();
            }

            function applyMissingNoteHighlight() {
                if (!diagramEl.value) {
                    return;
                }

                const missing = new Set(missingNoteIds.value);

                diagramEl.value
                    .querySelectorAll("g.node")
                    .forEach(node => {
                        const id = (node.id || "")
                            .split("flowchart-")
                            .pop()
                            .replace(/-\d+$/, "");

                        node.classList.toggle(
                            "missing-note",
                            highlightMissingNotes.value && missing.has(id)
                        );
                    });
            }

            function escapeNote(value) {
                return value
                    .split(BS)
                    .join(BS + BS)
                    .split('"')
                    .join(BS + '"')
                    .split(NL)
                    .join(BS + "n");
            }

            function findNoteDefinitionEnd(text, startIndex) {
                let inString = false;
                let escaped = false;

                for (
                    let index = startIndex;
                    index < text.length;
                    index += 1
                ) {
                    const character = text[index];

                    if (escaped) {
                        escaped = false;
                        continue;
                    }

                    if (character === BS) {
                        escaped = true;
                        continue;
                    }

                    if (character === '"') {
                        inString = !inString;
                        continue;
                    }

                    if (
                        character === "}" &&
                        !inString
                    ) {
                        return index;
                    }
                }

            return -1;
        }

            function applyNotes() {
                let text = source.value;
                const appended = [];

                notes.value.forEach(item => {
                    const marker = item.noteId + "@{";
                    const start = text.indexOf(marker);

                    if (start < 0) {
                        if (item.text.trim()) {
                            appended.push(
                                item.noteId +
                                '@{ shape: braces, label: "' +
                                escapeNote(item.text) +
                                '" }' +
                                NL +
                                item.noteId +
                                " --- " +
                                item.nodeId
                            );
                        }

                        return;
                    }

                    const end = findNoteDefinitionEnd(
                        text,
                        start + marker.length
                    );

                    if (end < 0) {
                        return;
                    }

                    const replacement =
                        item.noteId +
                        '@{ shape: braces, label: "' +
                        escapeNote(item.text) +
                        '" }';

                    text =
                        text.slice(0, start) +
                        replacement +
                        text.slice(end + 1);
                });

                if (appended.length) {
                    text = text + NL + appended.join(NL);
                }

                source.value = text;
                dirty.value = false;

                showToast(
                    "Notizen in den Markdown-Quelltext übernommen"
                );
            }

            async function copyText(value) {
                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {
                    await navigator.clipboard.writeText(value);
                    return;
                }

                const area =
                    document.createElement("textarea");

                area.value = value;
                area.setAttribute("readonly", "");
                area.style.position = "fixed";
                area.style.left = "-9999px";
                area.style.opacity = "0";

                document.body.appendChild(area);
                area.select();

                const successful =
                    document.execCommand("copy");

                area.remove();

                if (!successful) {
                    throw new Error(
                        "Der Text konnte nicht in die Zwischenablage kopiert werden."
                    );
                }
            }

            async function copyMarkdown() {
                try {
                    if (dirty.value) {
                        applyNotes();
                    }

                    await copyText(source.value);
                        showToast("Mermaid kopiert");
                    } catch (exception) {
                        error.value =
                            exception && exception.message
                                ? exception.message
                                : String(exception);
                    }
                }

                async function pasteMermaid() {
                    try {
                        const text = await navigator.clipboard.readText();

                        if (!text) {
                            return;
                        }

                        source.value = text;
                        await renderDiagram();
                        showToast("Mermaid eingefügt");
                } catch (exception) {
                    error.value =
                        exception && exception.message
                            ? exception.message
                            : String(exception);
                }
            }

            function escapeTemplateLiteral(value) {
                return value
                    .split(BS)
                    .join(BS + BS)
                    .split("`")
                    .join(BS + "`")
                    .split("${")
                    .join(BS + "${");
            }

            function findTemplateLiteralEnd(text, startIndex) {
                let escaped = false;

                for (
                    let index = startIndex;
                    index < text.length;
                    index += 1
                ) {
                    const character = text[index];

                    if (escaped) {
                        escaped = false;
                        continue;
                    }

                    if (character === BS) {
                        escaped = true;
                        continue;
                    }

                    if (character === "`") {
                        return index;
                    }
                }

                return -1;
            }

            async function downloadHtml() {
                try {
                    if (dirty.value) {
                        applyNotes();
                    }

                    const response = await fetch(location.href);
                    const html = await response.text();

                    const marker = "const SAMPLE = `";
                    const start = html.indexOf(marker);

                    if (start < 0) {
                        throw new Error(
                            "Vorlage konnte im Dokument nicht gefunden werden."
                        );
                    }

                    const contentStart = start + marker.length;
                    const end = findTemplateLiteralEnd(
                        html,
                        contentStart
                    );

                    if (end < 0) {
                        throw new Error(
                            "Ende der Vorlage konnte nicht gefunden werden."
                        );
                    }

                    const result =
                        html.slice(0, contentStart) +
                        escapeTemplateLiteral(source.value) +
                        html.slice(end);

                    const blob = new Blob([result], {
                        type: "text/html"
                    });

                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");

                    link.href = url;
                    link.download = "mermaid-renderer.html";
                    link.click();

                    URL.revokeObjectURL(url);

                    showToast("HTML-Datei heruntergeladen");
                } catch (exception) {
                    error.value =
                        exception && exception.message
                            ? exception.message
                            : String(exception);
                }
            }

            async function copyCurrentNote() {
                if (!selectedNote.value) {
                    return;
                }

                try {
                    await copyText(selectedNote.value.text);
                    showToast("Notiz kopiert");
                } catch (exception) {
                    error.value =
                        exception && exception.message
                            ? exception.message
                            : String(exception);
                }
            }

            function showToast(message) {
                toast.value = message;

                window.setTimeout(() => {
                    toast.value = "";
                }, 2200);
            }

            function applyZoomToSvg() {
                if (!diagramEl.value || !baseWidth.value) {
                    return;
                }

                const svg = diagramEl.value.querySelector("svg");

                if (svg) {
                    svg.style.width = baseWidth.value * zoom.value + "px";
                }
            }

            function clampZoom(value) {
                return Math.min(20, Math.max(0.3, Number(value.toFixed(2))));
            }

            function zoomAt(clientX, clientY, factor) {
                const el = viewport.value;

                if (!el) {
                    zoom.value = clampZoom(zoom.value * factor);
                    return;
                }

                const rect = el.getBoundingClientRect();
                const offsetX = clientX - rect.left + el.scrollLeft;
                const offsetY = clientY - rect.top + el.scrollTop;
                const oldZoom = zoom.value;
                const newZoom = clampZoom(oldZoom * factor);

                if (newZoom === oldZoom) {
                    return;
                }

                const ratio = newZoom / oldZoom;
                zoom.value = newZoom;

                nextTick(() => {
                    el.scrollLeft = offsetX * ratio - (clientX - rect.left);
                    el.scrollTop = offsetY * ratio - (clientY - rect.top);
                });
            }

            function zoomAtCenter(factor) {
                const el = viewport.value;

                if (!el) {
                    zoom.value = clampZoom(zoom.value * factor);
                    return;
                }

                const rect = el.getBoundingClientRect();
                zoomAt(
                    rect.left + rect.width / 2,
                    rect.top + rect.height / 2,
                    factor
                );
            }

            function zoomIn() {
                zoomAtCenter(1.15);
            }

            function zoomOut() {
                zoomAtCenter(1 / 1.15);
            }

            function resetZoom() {
                zoom.value = clampZoom(1);
            }

            function fontSizeIn() {
                fontSize.value = Math.min(32, fontSize.value + 1);
            }

            function fontSizeOut() {
                fontSize.value = Math.max(8, fontSize.value - 1);
            }

            function resetFontSize() {
                fontSize.value = 13;
            }

            function onWheel(event) {
                if (!event.ctrlKey) {
                    return;
                }

                event.preventDefault();
                zoomAt(
                    event.clientX,
                    event.clientY,
                    event.deltaY < 0 ? 1.15 : 1 / 1.15
                );
            }

            function fitDiagram() {
                if (viewport.value && baseWidth.value) {
                    const available = viewport.value.clientWidth - 80;
                    zoom.value = clampZoom(available / baseWidth.value);
                } else {
                    zoom.value = 0.8;
                }

                nextTick(() => {
                    if (viewport.value) {
                        viewport.value.scrollTo({
                            top: 0,
                            left: 0,
                            behavior: "smooth"
                        });
                    }
                });
            }

            function startPan(event) {
                if (event.button !== 1) {
                    return;
                }

                event.preventDefault();

                const el = viewport.value;

                if (!el) {
                    return;
                }

                const startX = event.clientX;
                const startY = event.clientY;
                const startScrollLeft = el.scrollLeft;
                const startScrollTop = el.scrollTop;
                const previousCursor = el.style.cursor;

                el.style.cursor = "grabbing";

                const move = currentEvent => {
                    el.scrollLeft =
                        startScrollLeft - (currentEvent.clientX - startX);
                    el.scrollTop =
                        startScrollTop - (currentEvent.clientY - startY);
                };

                const up = () => {
                    el.style.cursor = previousCursor;
                    window.removeEventListener("mousemove", move);
                    window.removeEventListener("mouseup", up);
                };

                window.addEventListener("mousemove", move);
                window.addEventListener("mouseup", up);
            }

            function startResize(event) {
                const startX = event.clientX;
                const startWidth = panelWidth.value;

                const move = currentEvent => {
                    panelWidth.value = Math.min(
                        620,
                        Math.max(
                            280,
                            startWidth +
                            startX -
                            currentEvent.clientX
                        )
                    );
                };

                const up = () => {
                    window.removeEventListener(
                        "mousemove",
                        move
                    );

                    window.removeEventListener(
                        "mouseup",
                        up
                    );
                };

                window.addEventListener(
                    "mousemove",
                    move
                );

                window.addEventListener(
                    "mouseup",
                    up
                );
            }

            function initMermaid() {
                mermaid.initialize({
                    startOnLoad: false,
                    securityLevel: "loose",
                    theme: "base",
                    flowchart: {
                        curve: "linear",
                        htmlLabels: true,
                        nodeSpacing: 38,
                        rankSpacing: 56,
                        padding: 8
                    },
                    themeVariables: darkMode.value
                        ? {
                            fontFamily:
                                "Segoe UI, Arial, sans-serif",
                            fontSize: fontSize.value + "px",
                            primaryColor: "#2a2f3a",
                            primaryTextColor: "#e2e8f0",
                            primaryBorderColor: "#8a93a3",
                            lineColor: "#8a93a3",
                            secondaryColor: "#20384a",
                            tertiaryColor: "#1f2530",
                            clusterBkg: "#232936",
                            clusterBorder: "#5b6472"
                        }
                        : {
                            fontFamily:
                                "Segoe UI, Arial, sans-serif",
                            fontSize: fontSize.value + "px",
                            primaryColor: "#fffdf3",
                            primaryTextColor: "#1f2937",
                            primaryBorderColor: "#4d5966",
                            lineColor: "#596674",
                            secondaryColor: "#dcebf7",
                            tertiaryColor: "#f1f5f9",
                            clusterBkg: "#e9eef4",
                            clusterBorder: "#778899"
                        }
                });
            }

            function toggleDarkMode() {
                darkMode.value = !darkMode.value;
            }

            function applyDarkClass(value) {
                document
                    .getElementById("app")
                    .classList.toggle("dark", value);
            }

            watch(darkMode, value => {
                localStorage.setItem(
                    "mermaidRendererDarkMode",
                    value ? "1" : "0"
                );

                applyDarkClass(value);
                initMermaid();

                if (activeView.value === "diagram") {
                    renderDiagram();
                }
            });

            watch(zoom, applyZoomToSvg);

            watch(fontSize, value => {
                localStorage.setItem("mermaidRendererFontSize", value);
                initMermaid();

                if (activeView.value === "diagram") {
                    renderDiagram();
                }
            });

            watch(showNoteList, value => {
                localStorage.setItem(
                    "mermaidRendererShowNoteList",
                    value ? "1" : "0"
                );
            });

            watch(source, value => {
                localStorage.setItem("mermaidRendererSource", value);
            });

            watch(missingNoteIds, () => {
                if (highlightMissingNotes.value) {
                    applyMissingNoteHighlight();
                }
            });

            onMounted(() => {
                applyDarkClass(darkMode.value);

                if (
                    typeof mermaid === "undefined"
                ) {
                    error.value =
                        "Mermaid konnte nicht geladen werden.";
                    return;
                }

                initMermaid();
                renderDiagram();
            });

            return {
                source,
                diagramEl,
                viewport,
                zoom,
                activeView,
                panelWidth,
                search,
                notes,
                selectedId,
                showNoteList,
                dirty,
                error,
                toast,
                darkMode,
                toggleDarkMode,
                nodeCount,
                noteEntries,
                missingNoteIds,
                highlightMissingNotes,
                toggleMissingNotesHighlight,
                selectedNote,
                filteredNotes,
                renderDiagram,
                selectNote,
                applyNotes,
                copyMarkdown,
                pasteMermaid,
                downloadHtml,
                copyCurrentNote,
                zoomIn,
                zoomOut,
                resetZoom,
                fontSize,
                fontSizeIn,
                fontSizeOut,
                resetFontSize,
                onWheel,
                fitDiagram,
                startPan,
                startResize
            };
        }
    }).mount("#app");
  </script>
</body>
</html>
